      `freejt7-v2` cuando el modo es `agent`, `freejt7-agent-runtime.js` ahora
      usa `freejt7-agent-core-v2` como ruta primaria por defecto para provider
      externo y reserva `openclaw-agent` solo para prompts que requieren MCP
      nativo (browser/documentos/escritorio), y `routeTaskWithGoal()` dejó de
      llamar `_callProvider()` directamente para pasar por el runtime propio o
